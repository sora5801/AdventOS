# Session 60 — AdventOS resolv.conf
#
# Each `nameserver IP` line registers an additional DNS server beyond
# whatever DHCP option 6 hands us. dns_resolve walks the list in order,
# failing over to the next on timeout.
#
# The DHCP primary on the SLIRP network is 10.0.2.3 — Google Public
# DNS and Cloudflare's 1.1.1.1 below are well-known recursive
# resolvers used as fallbacks if the SLIRP forwarder is unhappy.

nameserver 10.0.2.3
nameserver 8.8.8.8
nameserver 1.1.1.1
